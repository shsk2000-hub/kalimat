name: kalimat
description: "Kalimat word challenge Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_database: ^12.0.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^7.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
